<!DOCTYPE html>
<html>
<head>
  <title>Teacher Login</title>

  <style>
    body {
        font-family: Arial;
        background-color: #ecf0f1;
        text-align: center;
        padding-top: 100px;
    }

    .box {
        background: white;
        width: 300px;
        margin: auto;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0px 0px 10px gray;
    }

    input {
        width: 90%;
        padding: 10px;
        margin: 10px 0;
    }

    button {
        padding: 10px 20px;
        background-color: #27ae60;
        border: none;
        color: white;
        cursor: pointer;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>Teacher Login</h2>

  <input type="text" placeholder="Teacher ID">
  <input type="password" placeholder="Password">

  <button>Login</button>
</div>

</body>
</html>
